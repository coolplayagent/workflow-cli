name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p workflow-cli --locked
      - run: python3 examples/validation/baseline.py target/debug/workflow
      - run: python3 examples/approval/local-demo.py target/debug/workflow
      - run: python3 examples/migrations/acceptance.py target/debug/workflow
      - run: python3 examples/workspaces/execute-isolated.py target/debug/workflow
      - run: python3 examples/gates/release-acceptance.py target/debug/workflow
      - run: python3 -m pip install -r website/requirements.txt
      - run: python3 scripts/package_skill.py --binary target/debug/workflow --output dist
      - run: python3 scripts/verify_skill.py dist/workflow-cli-skill-*.tar.gz
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install -r website/requirements.txt
      - run: python3 scripts/check_docs.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/build_site.py
  bazel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - run: bazel test //...
      - run: bazel run //:workflow -- validate "$PWD/examples/review.yaml"
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: workflow-isolated-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=workflow-isolated-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Isolate experiments with real lease/deadline clocks. Each concurrency
      # contract still starts its own competing connections and OS processes.
      - run: cargo test -p workflow-runstore-postgres --locked -- --ignored --nocapture --test-threads=1
      - run: cargo test -p workflow-service --locked -- --ignored --nocapture --test-threads=1
      - run: cargo build -p workflow-cli --locked
      - run: python3 examples/validation/https-cli.py target/debug/workflow
      - run: python3 examples/models/https-cli.py target/debug/workflow
      - run: python3 examples/security/acceptance.py target/debug/workflow
      - run: python3 examples/cluster/acceptance.py target/debug/workflow
      - run: python3 examples/gates/release-acceptance.py target/debug/workflow --https
      - run: python3 examples/artifacts/object-contract.py target/debug/workflow
      - run: python3 examples/templates/acceptance.py target/debug/workflow --output template-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: template-acceptance
          path: template-acceptance
          if-no-files-found: error
          retention-days: 14
      - run: python3 examples/migrations/acceptance.py target/debug/workflow --https
      - run: python3 examples/remote/database-recovery.py target/debug/workflow --container "${{ job.services.postgres.id }}"
