schema_version: 1
domains:
  - id: workflow
    name: Business workflow contracts
    description: Portable business SOP definitions independent of model and deployment bindings.
terms:
  - id: definition
    domain: workflow
    canonical_name: Workflow definition
    definition: A versioned graph of business steps with explicit contracts, legal routes and terminal outcomes.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-ir/src/lib.rs
  - id: capability
    domain: workflow
    canonical_name: Capability reference
    definition: A stable ID and exact version identifying a unit of work implemented by a CLI or API adapter; a Skill supplies usage semantics.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-ir/src/lib.rs
  - id: static-validation
    domain: workflow
    canonical_name: Static definition validation
    definition: Checks the portable definition for type, reference and graph errors before runtime binding and execution; it is not an execution receipt.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-validator/src/lib.rs
  - id: definition-draft
    domain: workflow
    canonical_name: Definition draft
    definition: An editable workflow definition with a permanent authoring identity, optimistic revision and retained history; it may contain semantic diagnostics.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-definitions/src/lib.rs
  - id: published-definition
    domain: workflow
    canonical_name: Published definition
    definition: Statically validated immutable definition content bound to workflow ID, version, digest and source draft revision; publication does not start execution.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-registry-sqlite/src/lib.rs
  - id: capability-descriptor
    domain: workflow
    canonical_name: Capability descriptor
    definition: An immutable adapter contract identified by exact capability version and digest, declaring typed inputs and outputs, errors, timeout, effects and Skill usage.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-worker/src/descriptor.rs
  - id: work-request
    domain: workflow
    canonical_name: Work request
    definition: A versioned invocation carrying exact input and capability digests, deadlines and trace identity; workflow scope also identifies the definition, run, node instance, attempt and lease epoch.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-worker/src/protocol.rs
  - id: execution-grant
    domain: workflow
    canonical_name: Execution grant
    definition: A host-issued request digest and expiry binding for an approved invocation; the host separately establishes authentication, current ownership and authority to commit state.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-worker/src/protocol.rs
  - id: workflow-kernel
    domain: workflow
    canonical_name: Deterministic workflow kernel
    definition: A pure reducer of trusted host events into typed workflow state and ordered command intents, with pinned bundle contracts and no external I/O.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-kernel/src/engine.rs
  - id: node-instance
    domain: workflow
    canonical_name: Node instance
    definition: A unique occurrence of a workflow node within a run, allocated afresh for every child frame and loop iteration.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-kernel/src/model.rs
  - id: run-checkpoint
    domain: workflow
    canonical_name: Run checkpoint
    definition: A bounded run seed and accepted event journal whose checksum and replayed state digest detect corruption; authentication and transactional durability belong to the host.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-kernel/src/model.rs
  - id: run-store
    domain: workflow
    canonical_name: RunStore
    definition: A persistence port that commits an immutable run seed, authoritative state revision, accepted events and successor command intents atomically before acknowledgement.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-runstore/src/lib.rs
  - id: command-outbox
    domain: workflow
    canonical_name: Command outbox
    definition: An ordered persistent journal of kernel intents with stable run-revision-command identities, retained across retries and process recovery until acknowledged by a host.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-runstore-sqlite/src/writes.rs
  - id: delivery-receipt
    domain: workflow
    canonical_name: Delivery receipt
    definition: An immutable host acknowledgement of durable command delivery bound to the exact command digest; it is separate from task completion and external effect evidence.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-runstore/src/model.rs
  - id: run-lease
    domain: workflow
    canonical_name: Run execution lease
    definition: A bounded ownership grant for one local run, identified by owner, unique acquisition and increasing epoch; expiry or replacement fences new result settlement.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-runstore/src/execution/authority.rs
  - id: durable-attempt
    domain: workflow
    canonical_name: Durable task attempt
    definition: An exact worker request and grant committed before invocation, binding the command, node instance, inputs and lease epoch; read-only orphans may be retried within a fixed budget.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-runstore/src/execution/model.rs
  - id: result-settlement
    domain: workflow
    canonical_name: Atomic result settlement
    definition: One fenced transaction that persists a validated worker result, kernel event and state, successor intents, command receipt and execution journal before acknowledging completion.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-runstore-sqlite/src/execution/tasks.rs
  - id: artifact-manifest
    domain: workflow
    canonical_name: Typed artifact manifest
    definition: An immutable portable record binding exact content schema and digest to producer run, node instance, attempt, request and input digests, source revision, upstream artifact identities and retained run scope.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-artifacts/src/model.rs
  - id: artifact-publication
    domain: workflow
    canonical_name: Durable artifact publication
    definition: A protocol that syncs content before committing its immutable manifest and catalog integrity head; process failure leaves an uncommitted orphan or a complete verified artifact reference.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-artifact-local/src/writes.rs
  - id: artifact-impact
    domain: workflow
    canonical_name: Artifact revalidation impact
    definition: A read-only projection of retained downstream artifacts and their producers affected by replacing an exact upstream artifact; it preserves historical evidence and does not itself authorize recomputation.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-artifact-local/src/lib.rs
  - id: evidence-decision
    domain: workflow
    canonical_name: Evidence decision
    definition: A deterministic PASS, FAIL or UNKNOWN observation bound to an exact policy, action, target and settled execution evidence with an exclusive expiry; it does not itself advance a run or authorize an effect.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-gates/src/model.rs
  - id: runtime-postcondition
    domain: workflow
    canonical_name: Mandatory runtime postcondition
    definition: An immutable run-bundle policy and target binding that withholds task or terminal success until a fenced PASS; UNKNOWN waits for explicit retry and FAIL follows declared bounded repair.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-kernel/src/postconditions.rs
  - id: gate-settlement
    domain: workflow
    canonical_name: Atomic gate settlement
    definition: A lease-fenced transaction that recomputes evidence from settled execution records and commits the gate observation, state, successor intents, receipt and recovery proof before exclusive expiry.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-runstore-sqlite/src/execution/controls.rs
  - id: attempt-workspace
    domain: workflow
    canonical_name: Attempt workspace
    definition: An immutable allocation contract binding a run, node instance and attempt to exact request/input digests, committed source files, typed output declarations and an explicit merge policy; its editable files are physically independent.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-workspaces/src/model.rs
  - id: workspace-observation
    domain: workflow
    canonical_name: Workspace observation
    definition: A deterministic file and executable-bit inventory with a tree digest and changes against the allocated baseline; it describes observed bytes without granting execution or proving an external target stayed unchanged.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-workspace-local/src/files.rs
  - id: workspace-output-capture
    domain: workflow
    canonical_name: Workspace output capture
    definition: Retained typed artifacts for declared workspace paths plus a manifest binding the baseline, observed tree and file links; input dependencies remain in lineage and later edits cannot rewrite the capture.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-workspace-local/src/store.rs
  - id: model-policy
    domain: workflow
    canonical_name: Bounded model policy
    definition: An immutable task-local goal with exact task and read-only tool contracts and per-attempt call, context, response and output-token bounds; provider configuration remains a separate host binding.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-models/src/policy.rs
  - id: model-session-record
    domain: workflow
    canonical_name: Explicit model session record
    definition: Request-bound visible proposals, tool observations, provider identifiers, reported usage and times whose deterministic replay validates the derived task outcome without resampling or granting state authority.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-models/src/session.rs
  - id: run-admission-pause
    domain: workflow
    canonical_name: Run admission pause
    definition: A durable control that stops new work, timer advancement and successor activation while retaining pending intents and accepting outcomes of already prepared tasks; resume observes the original absolute deadlines.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-kernel/src/engine/lifecycle.rs
  - id: durable-signal-inbox
    domain: workflow
    canonical_name: Durable signal Inbox
    definition: Retained host callback receipts reduced from run history, binding a concrete wait instance, immutable definition and input digest; committed receipt, pending delivery and applied decision are separate facts.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-kernel/src/inbox.rs
  - id: durable-effect-ledger
    domain: workflow
    canonical_name: Durable effect ledger
    definition: A run-bound record of write intents, stable operation keys, fenced attempts and provider observations; an unknown outcome requires query or declared target deduplication, otherwise audited manual reconciliation.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-effects/src/ledger.rs
  - id: effect-query-absence
    domain: workflow
    canonical_name: Effect query absence
    definition: A provider observation that the operation was not found at query time; it does not prevent an older writer from applying later and cannot alone authorize another write.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-effects/src/model.rs
  - id: ordered-effect-compensation
    domain: workflow
    canonical_name: Ordered effect compensation
    definition: An explicitly routed write that binds its original Applied receipt and waits for dependent effects to be compensated; a confirmed undo marks the original while failed cleanup remains visible for manual takeover.
    language: en
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/workflow-effects/src/compensation.rs
